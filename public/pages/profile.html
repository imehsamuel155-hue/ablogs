<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Profile — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/app-ui.css" />
</head>

<body class="app-shell">
    <header class="topbar">
        <a class="logo" href="/dashboard"><img id="siteLogo" src="/images/logo.png" alt=""
                style="height:28px;display:none;" onerror="this.style.display='none'" /><span>Ablogs</span></a>
        <button type="button" id="btnMenu" class="menu-btn" aria-label="Menu">☰</button>
    </header>
    <div class="side-drawer" id="drawer">
        <div class="dim" id="drawerDim"></div>
        <div class="panel">
            <p class="drawer-title" id="drawerName">Menu</p>
            <a href="/dashboard">Dashboard</a>
            <a href="/products">Logs</a>
            <a href="/wallet">Wallet</a>
            <a href="/purchases">Orders</a>
            <a href="/profile" class="active">Profile</a>
            <a href="/working-pictures">Working Pictures</a>
            <a href="/tools">Tools</a>
            <a href="/format">Format</a>
            <a href="#" class="nav-coming-soon" onclick="return false;" aria-disabled="true">Buy WhatsApp / Rent number
                <span class="coming">Coming soon</span></a>
            <a href="#" id="navLogout" class="logout-link">Logout</a>
        </div>
    </div>
    <div class="section">
        <h2>Profile</h2>
        <div class="list-card" style="padding:16px;">
            <div class="form-group"><label>Name</label>
                <input id="pfName" disabled
                    style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#f1f5f9;color:#64748b;" />
            </div>
            <div class="form-group"><label>Email</label>
                <input id="pfEmail" disabled
                    style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#f1f5f9;color:#64748b;" />
            </div>
            <div class="form-group"><label>Phone</label>
                <input id="pfPhone" disabled
                    style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#f1f5f9;color:#64748b;" />
            </div>
            <div class="form-group"><label>New password</label>
                <input type="password" id="pfPass" minlength="6" placeholder="Leave blank to keep current"
                    style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);" />
            </div>
            <button type="button" class="btn-fill-r" id="btnSaveProfile"
                style="width:100%;padding:12px;margin-top:8px;">Change password</button>
        </div>
    </div>
    <div class="chat-full" id="chatFull">
        <div class="ch-head">
            <span class="ch-title">Live support</span>
            <button type="button" id="btnCloseChat" class="ch-close-x" aria-label="Close chat"
                title="Back to dashboard">✕</button>
        </div>
        <div class="ch-body" id="chatBody"></div>
        <div class="ch-foot" style="display:flex;gap:6px;align-items:center;">
            <label style="cursor:pointer;padding:6px 8px;background:#f1f5f9;border-radius:8px;" title="Send photo">
                📷
                <input type="file" id="chatPhoto" accept="image/*" style="display:none;" />
            </label>
            <input type="text" id="chatInput" placeholder="Type a message..." style="flex:1;" />
            <button type="button" id="chatSend">Send</button>
        </div>
    </div>
    <div class="toast-m" id="toast"></div>
    <script src="/js/marketplace.js"></script>
    <script>Market.initProfile();</script>
</body>

</html>
