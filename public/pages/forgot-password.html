<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <a class="brand" href="/"><span>Ablogs</span></a>
        </div>
    </header>
    <main class="page">
        <div class="container" style="max-width:420px;margin:24px auto;">
            <div class="auth-modal" style="position:relative;box-shadow:var(--shadow);">
                <h2 style="margin-bottom:12px;color:var(--red);">Forgot password</h2>
                <div id="stepRequest">
                    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:12px;">Enter your email to reset your
                        password.</p>
                    <form id="reqForm">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email" required />
                        </div>
                        <div class="form-error" id="err1"></div>
                        <button type="submit" class="btn btn-red btn-block">Send reset link</button>
                    </form>
                </div>
                <div id="stepReset" class="hidden">
                    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:12px;">Enter a new password.</p>
                    <form id="resetForm">
                        <div class="form-group">
                            <label>New password</label>
                            <input type="password" id="password" required minlength="6" />
                        </div>
                        <div class="form-error" id="err2"></div>
                        <button type="submit" class="btn btn-red btn-block">Update password</button>
                    </form>
                </div>
                <p class="auth-hint"><a href="/login">Back to login</a></p>
                <p class="auth-hint" id="msg" style="color:#059669;"></p>
            </div>
        </div>
    </main>
    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get('token');
        if (token) {
            document.getElementById('stepRequest').classList.add('hidden');
            document.getElementById('stepReset').classList.remove('hidden');
        }
        document.getElementById('reqForm').onsubmit = async (e) => {
            e.preventDefault();
            const err = document.getElementById('err1');
            err.textContent = '';
            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value.trim() })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                document.getElementById('msg').textContent = data.message + (data.resetPath ? ' Use: ' + data.resetPath : '');
                if (data.resetPath) {
                    // Dev helper: open reset step
                    location.href = data.resetPath;
                }
            } catch (ex) { err.textContent = ex.message; }
        };
        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const err = document.getElementById('err2');
            err.textContent = '';
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                document.getElementById('msg').textContent = data.message;
                setTimeout(() => location.href = '/login', 1500);
            } catch (ex) { err.textContent = ex.message; }
        };
    </script>
</body>

</html>
