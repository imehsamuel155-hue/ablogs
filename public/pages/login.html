<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        body {
            background: #fff;
            margin: 0;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-page main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 40px;
        }

        .auth-card {
            width: min(420px, 100%);
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 28px 22px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .logo-box {
            width: 88px;
            height: 88px;
            margin: 0 auto 16px;
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #fafafa;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .auth-card h1 {
            font-size: 1.4rem;
            margin: 0 0 6px;
            color: #dc2626;
        }

        .auth-card .sub {
            color: #6b7280;
            font-size: 0.92rem;
            margin-bottom: 18px;
        }

        .auth-card .form-group {
            text-align: left;
            margin-bottom: 12px;
        }

        .auth-card label {
            display: block;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn-red {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #dc2626;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-red:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .form-error {
            color: #dc2626;
            font-size: 0.9rem;
            min-height: 20px;
            margin: 8px 0;
            text-align: left;
        }

        .header,
        .footer {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
        }

        .footer {
            border-top: 1px solid #f1f5f9;
            border-bottom: none;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #0f172a;
            font-weight: 800;
        }

        .brand img {
            height: 32px;
            object-fit: contain;
        }
    </style>
</head>

<body class="auth-page">
    <header class="header">
        <a class="brand" href="/">
            <img id="hdrLogo" src="/images/logo.png" alt="logo" onerror="this.style.display='none'" />
            <span id="hdrName">Ablogs</span>
        </a>
    </header>
    <main>
        <div class="auth-card">
            <div class="logo-box">
                <img id="cardLogo" src="/images/logo.png" alt="Site logo"
                    onerror="this.alt='Add logo.png';this.style.opacity='.4'" />
            </div>
            <h1>Login</h1>
            <p class="sub">Enter your email and password</p>
            <form id="loginForm">
                <div class="form-group"><label>Email</label><input type="email" id="email" required
                        placeholder="you@email.com" /></div>
                <div class="form-group"><label>Password</label><input type="password" id="password" required
                        placeholder="••••••••" /></div>
                <div class="form-error" id="err"></div>
                <button type="submit" class="btn-red" id="btnLogin">Login</button>
            </form>
            <p style="margin-top:16px;font-size:0.9rem;">No account? <a href="/signup"><strong>Create
                        account</strong></a></p>
            <p style="margin-top:8px;font-size:0.85rem;"><a href="/forgot-password">Forgot password?</a></p>
        </div>
    </main>
    <footer class="footer">
        <img id="ftrLogo" src="/images/logo.png" alt="" style="height:22px;vertical-align:middle;margin-right:6px;"
            onerror="this.style.display='none'" />
        <strong id="ftrName">Ablogs</strong>
    </footer>
    <script>
        async function loadLogo() {
            try {
                const r = await fetch('/api/user/settings-public');
                const d = await r.json();
                const s = d.settings || {};
                const url = s.logoUrl || '/images/logo.png';
                ['cardLogo', 'hdrLogo', 'ftrLogo'].forEach((id) => {
                    const el = document.getElementById(id);
                    if (el) { el.src = url; el.style.display = ''; }
                });
                if (s.siteName) {
                    document.getElementById('hdrName').textContent = s.siteName;
                    document.getElementById('ftrName').textContent = s.siteName;
                }
            } catch (_) { }
        }
        loadLogo();
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const err = document.getElementById('err');
            err.textContent = '';
            btn.disabled = true;
            btn.textContent = '......';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Login failed');
                localStorage.setItem('ablogs_token', data.token);
                sessionStorage.removeItem('ablogs_ann_dismissed');
                localStorage.setItem('ablogs_user', JSON.stringify(data.user || {}));
                // Always customer dashboard after login/signup — admin only via /admin
                location.href = '/dashboard';
            } catch (ex) {
                err.textContent = ex.message || 'Login failed';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        };
    </script>
</body>

</html>
