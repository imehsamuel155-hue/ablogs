<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Working Pictures — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/app-ui.css" />
</head>

<body class="app-shell">
    <header class="topbar">
        <a class="logo" href="/dashboard"><span>Ablogs</span></a>
        <button type="button" id="btnMenu" class="menu-btn" aria-label="Menu">☰</button>
    </header>
    <div class="side-drawer" id="drawer">
        <div class="dim" id="drawerDim"></div>
        <div class="panel">
            <p class="drawer-title" id="drawerName">Menu</p>
            <a href="/dashboard">Dashboard</a>
            <a href="/products">Logs</a>
            <a href="/wallet">Wallet</a>
            <a href="/purchases">Orders</a>
            <a href="/profile">Profile</a>
            <a href="/working-pictures" class="active">Working Pictures</a>
            <a href="/tools">Tools</a>
            <a href="/format">Format</a>
            <a href="#" class="nav-coming-soon" onclick="return false;" aria-disabled="true">Buy WhatsApp / Rent number
                <span class="coming">Coming soon</span></a>
            <a href="#" id="navLogout" class="logout-link">Logout</a>
        </div>
    </div>
    <div class="section">
        <h2>Working Pictures</h2>
        <p style="color:var(--muted);font-size:0.9rem;">Browse and purchase photo collections</p>
        <div class="balance-pill">Balance: <strong id="balPill">₦0</strong> <a href="/wallet">+ Fund</a></div>
        <div class="wp-grid" id="wpGrid"></div>
    </div>
    <div class="chat-full" id="chatFull">
        <div class="ch-head"><span class="ch-title">Live support</span><button type="button" id="btnCloseChat"
                class="ch-close-x" aria-label="Close chat" title="Back to dashboard">✕</button></div>
        <div class="ch-body" id="chatBody"></div>
        <div class="ch-foot" style="display:flex;gap:6px;align-items:center;">
            <label style="cursor:pointer;padding:6px 8px;background:#f1f5f9;border-radius:8px;">📷<input type="file"
                    id="chatPhoto" accept="image/*" style="display:none;" /></label>
            <input id="chatInput" style="flex:1;" /><button id="chatSend">Send</button>
        </div>
    </div>
    <div class="toast-m" id="toast"></div>
    <script src="/js/marketplace.js"></script>
    <script>Market.initWorkingPictures();</script>
</body>

</html>
