<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ablogs — Accounts & digital services</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <img src="/images/logo.png" alt="Ablogs"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />
                <span class="brand-fallback" style="display:none">A</span>
                <span>Ablogs</span>
            </a>
            <div class="header-actions">
                <a class="btn btn-white" href="/login">Login</a>
                <a class="btn btn-white" href="/signup" style="margin-left:6px;">Sign up</a>
                <button type="button" class="icon-btn" id="btnMenu">☰</button>
            </div>
        </div>
    </header>

    <div class="overlay" id="overlay"></div>
    <aside class="sidenav" id="sidenav">
        <button type="button" class="close-nav" id="btnCloseNav">×</button>
        <h3>Menu</h3>
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/login">Login</a>
        <a href="/signup">Sign up</a>
        <a href="/dashboard">Dashboard</a>
    </aside>

    <main class="page">
        <div class="search-wrap">
            <div class="search-box">
                <span>🔍</span>
                <input type="search" id="searchInput" placeholder="Search FB, IG, VPN..." />
                <button type="button" id="btnSearch">Search</button>
            </div>
        </div>
        <p class="hero-note">Buy accounts &amp; digital services · Secure wallet</p>
        <div class="container">
            <div class="guest-banner">
                <h2>Welcome to Ablogs</h2>
                <p>Login or create an account to deposit, buy and track orders.</p>
                <a class="btn btn-red" href="/signup">Create account</a>
                <a class="btn btn-outline" href="/login" style="margin-left:8px;">Login</a>
            </div>
            <h3 class="section-title" id="shopSection">Popular</h3>
            <div class="products" id="productGrid"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div><strong>Ablogs</strong>
                <div style="opacity:.9;font-size:.9rem;">Accounts · VPN · Digital</div>
            </div>
            <div><a href="/login">Login</a> · <a href="/signup">Sign up</a></div>
        </div>
    </footer>

    <div class="float-left"><button type="button" class="fab fab-wa" id="fabWa">WA</button></div>
    <div class="float-right"><button type="button" class="fab fab-chat" id="fabChat">💬</button></div>
    <div class="chat-panel" id="chatPanel">
        <div class="chat-head"><span>Ablogs support</span><button type="button" id="btnCloseChat">×</button></div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-foot"><input type="text" id="chatInput" /><button type="button" id="chatSend">Send</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
    <script>
        if (localStorage.getItem('ablogs_token')) {
            // optional: stay on home or go dashboard — keep home public
        }
    </script>
</body>

</html>
